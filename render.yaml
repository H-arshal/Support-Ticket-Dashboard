services:
  # Backend Spring Boot API
  - type: web
    name: ticket-manager-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: DB_HOST
        value: mysql-ticket-manager-ticketmanager-01.d.aivencloud.com
      - key: DB_PORT
        value: 25970
      - key: DB_NAME
        value: support_tickets
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "*" # To be updated to frontend URL once known

  # Frontend React App (Nginx)
  - type: web
    name: ticket-manager-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://ticket-manager-backend.onrender.com/api" # Render auto-assigns this format
