services:
  mongodb:
    image: mongo:latest
    container_name: ticket_manager_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: dbuser
      MONGO_INITDB_ROOT_PASSWORD: dbpassword
      MONGO_INITDB_DATABASE: support_tickets
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ticket_manager_backend
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://dbuser:dbpassword@mongodb:27017/support_tickets?authSource=admin}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:5173}
    depends_on:
      - mongodb
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticket_manager_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
