services:
  mysql:
    image: mysql:8.0
    container_name: ticket_manager_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: support_tickets
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: dbpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ticket_manager_backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-support_tickets}
      - DB_USERNAME=${DB_USERNAME:-dbuser}
      - DB_PASSWORD=${DB_PASSWORD:-dbpassword}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:5173}
    depends_on:
      - mysql
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticket_manager_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
